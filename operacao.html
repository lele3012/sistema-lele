<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lelé Operação</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#2a7a3b;--gl:#e8f5eb;--b:#e0dbd3;--r:#c0392b;--rl:#fdecea;--y:#9a6b00;--yl:#fff6dd}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f2ed;color:#1a1a1a;min-height:100vh}
.top{background:var(--g);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px}
.top h1{font-size:16px;font-weight:800}
.top .quem{font-size:12px;opacity:.85}
.top button{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
#conexao{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:#fff;color:var(--g)}
#conexao.off{background:#f6c343;color:#1a1a1a}
.nav{display:flex;background:#fff;border-bottom:2px solid var(--b);overflow-x:auto;position:sticky;top:50px;z-index:99}
.tab{flex:1;padding:12px 14px;font-size:13px;font-weight:700;color:#888;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap;text-align:center}
.tab.on{color:var(--g);border-bottom-color:var(--g)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--b)}
.stitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#888;margin:18px 0 10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.05em}
.inp{border:1.5px solid var(--b);border-radius:10px;padding:11px 14px;font-size:16px;color:#1a1a1a;outline:none;background:#fff;font-family:inherit;width:100%}
.inp:focus{border-color:var(--g)}
.grade{display:grid;grid-template-columns:1fr 92px;gap:8px 10px;align-items:center}
.grade .nm{font-size:15px;font-weight:600}
.grade input{text-align:center;padding:10px 6px;font-size:18px;font-weight:700}
.btn{width:100%;padding:14px 16px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-g{background:var(--g);color:#fff}
.btn-o{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn-r{background:var(--r);color:#fff}
.btn-sm{width:auto;padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>*{flex:1}
.mov{border-top:1px solid var(--b);padding:10px 0;font-size:14px}
.mov:first-child{border-top:none}
.mov .t{font-weight:700}
.mov .s{font-size:12px;color:#777;margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:4px}
.b-g{background:var(--gl);color:var(--g)}.b-r{background:var(--rl);color:var(--r)}.b-y{background:var(--yl);color:var(--y)}
.alert{border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:12px;line-height:1.45}
.a-g{background:var(--gl);color:#1d5a2b}.a-r{background:var(--rl);color:#8a2318}.a-y{background:var(--yl);color:#6b4a00}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--b)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;color:#888;letter-spacing:.04em}
td.neg{color:var(--r);font-weight:800}td.pos{color:var(--y);font-weight:800}td.ok{color:var(--g);font-weight:700}
.total{font-size:22px;font-weight:800;color:var(--g)}
.muted{color:#777;font-size:13px;line-height:1.45}
#login{position:fixed;inset:0;background:#f5f2ed;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
#login .caixa{background:#fff;border:1px solid var(--b);border-radius:14px;padding:26px 22px;max-width:380px;width:100%}
#login h2{font-size:20px;font-weight:800;color:var(--g);margin-bottom:4px;text-align:center}
#login p{text-align:center}
.pessoas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.pessoa{padding:14px;border:1.5px solid var(--b);border-radius:10px;text-align:center;font-weight:700;cursor:pointer;background:#fff;font-size:15px}
.pessoa.on{border-color:var(--g);background:var(--gl);color:var(--g)}
#pin{text-align:center;font-size:28px;letter-spacing:.5em;font-weight:800}
#login-erro{color:var(--r);font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.sep{text-align:center;color:#aaa;font-size:12px;margin:16px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px 16px 0 0;padding:20px 18px;max-width:720px;width:100%;max-height:90vh;overflow:auto}
.modal h3{font-size:18px;margin-bottom:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.on{opacity:1}
.drop{border:1px solid var(--b);border-radius:10px;max-height:260px;overflow:auto;margin-top:-6px;margin-bottom:12px;display:none}
.drop div{padding:12px 14px;border-bottom:1px solid var(--b);cursor:pointer;font-size:15px}
.drop div:last-child{border-bottom:none}
.sel-cli{background:var(--gl);color:var(--g);padding:12px 14px;border-radius:10px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="login">
  <div class="caixa">
    <h2>Lelé Operação</h2>
    <p class="muted">Quem está lançando?</p>
    <div class="pessoas" id="login-pessoas"></div>
    <div class="field"><label>PIN</label><input id="pin" class="inp" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"></div>
    <button class="btn btn-g" id="btn-entrar-pin">Entrar</button>
    <div id="login-erro"></div>
    <div class="sep">— gerência —</div>
    <button class="btn btn-o" id="btn-entrar-google">Entrar com Google</button>
  </div>
</div>

<div class="top">
  <div><h1>Lelé Operação</h1><div class="quem" id="quem"></div></div>
  <span id="conexao">online</span>
  <button id="btn-sair">Sair</button>
</div>
<div class="nav" id="nav"></div>
<div class="wrap" id="conteudo"></div>

<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>

<script>
// =====================================================================
// LELÉ OPERAÇÃO — expedição, rota e fechamento
// Tudo que é lançado aqui fica gravado em op/mov e NÃO pode ser editado
// nem apagado (as Regras do Firebase garantem isso). Erros se corrigem
// com uma solicitação em op/corr, que a gerência aprova ou rejeita; o
// lançamento original continua guardado.
// =====================================================================
var firebaseConfig = {
  apiKey: "AIzaSyCbXloSswZIhrBUyuIRhh_O1SMdlcjyTvc",
  authDomain: "lele-da-kuka-sistema.firebaseapp.com",
  databaseURL: "https://lele-da-kuka-sistema-default-rtdb.firebaseio.com",
  projectId: "lele-da-kuka-sistema",
  storageBucket: "lele-da-kuka-sistema.firebasestorage.app",
  messagingSenderId: "14233599355",
  appId: "1:14233599355:web:3ecc392fb1b16c6530d1de"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var auth = firebase.auth();
var TS = firebase.database.ServerValue.TIMESTAMP;

// Gerência (mesma lista do sistema principal e das Regras)
var EMAILS_GERENCIA = ['barbaradm160393@gmail.com','lele.dakuka26@gmail.com','lauracarvalhodemacedo@gmail.com'];
// Contas de operação: criadas no Firebase (Authentication > Usuários) com a
// senha  lk-PIN-op  (ex.: PIN 1234 -> senha lk-1234-op).
// Funcionário de fábrica: e-mail começando com "fabrica".
// Entregador: e-mail = <id do entregador>@leledakuka.app
var DOMINIO_OP = '@leledakuka.app';
var USUARIOS_OP = [
  {nome:'Darling', email:'fabrica.darling'+DOMINIO_OP},
  {nome:'Will', email:'will'+DOMINIO_OP}
];
// ===== FASE DE TESTE =====
// Com MODO_TESTE = true: tudo é gravado em "op_teste" e NADA é lançado nas
// Entregas/Cobranças/Caixa do sistema principal. Para valer: mude para false
// (os lançamentos passam a ir para "op", começando limpo).
var MODO_TESTE = true;
var OP = MODO_TESTE ? 'op_teste' : 'op';
var ENTREGADORES = [{id:'will', nome:'Will'}];

var PRODS = [['bola','Pão Bola'],['integral','Pão Integral'],['mini','Mini Sanduíche'],['las250','Lasanha 250g'],['las500','Lasanha 500g'],['suco','Suco de Laranja'],['salada','Salada de Frutas']];
var PRODS_TROCA = PRODS.slice(0,5);
var PRECO = {bola:8.50, integral:8.50, las250:11.00, las500:14.50, mini:2.30, suco:0, salada:0};
var FORMAS = [['vista','Dinheiro'],['pix','PIX'],['boleto7','Boleto 7 dias'],['prazo','À prazo (mensal)']];
var DIAS_ROTA = 14; // quantos dias para trás a tela carrega

// ---------- estado ----------
var U = {email:'', nome:'', papel:'', ent:''};
var CLI = [], MOV = [], CORR = {}, IMP = {};
var aba = '', gerDia = hoje(), rotaSel = '', vendaCli = null;
var subMov = null;

// ---------- utilidades ----------
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function hoje(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function somaDias(s,n){ var d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fdata(s){ if(!s) return ''; var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fhora(ts){ if(typeof ts!=='number') return 'enviando…'; var d=new Date(ts); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmt(n){ return 'R$ '+(n||0).toFixed(2).replace('.',','); }
function toast(m,t){ var el=$('toast'); el.textContent=m; el.className='toast on'; clearTimeout(toast._t); toast._t=setTimeout(function(){el.className='toast';},t||2800); }
function nomeProd(k){ var p=PRODS.find(function(x){return x[0]===k;}); return p?p[1]:k; }
function nomeForma(k){ var f=FORMAS.find(function(x){return x[0]===k;}); return f?f[1]:k; }
function nomeEnt(id){ var e=ENTREGADORES.find(function(x){return x.id===id;}); return e?e.nome:id; }
function nomeCli(c){ return c ? (c.fantasia||c.nome||'Cliente') : ''; }
function soma(a,b){ var r=Object.assign({},a||{}); Object.keys(b||{}).forEach(function(k){ r[k]=(r[k]||0)+(b[k]||0); }); return r; }
function totalUn(o){ return Object.keys(o||{}).reduce(function(s,k){return s+(o[k]||0);},0); }
function resumoItens(o){ var ks=Object.keys(o||{}).filter(function(k){return o[k];}); return ks.length ? ks.map(function(k){return o[k]+' '+nomeProd(k);}).join(', ') : '—'; }
function idRota(ent,data){ return ent+'_'+data; }
function precoCli(c,k){ return (c && c.precos && c.precos[k]) ? c.precos[k] : (PRECO[k]||0); }

// ---------- gravação com fila local ----------
// Cada lançamento fica guardado no aparelho até o Firebase confirmar.
// Se a internet cair ou a página fechar, ele é reenviado na próxima abertura.
var FILA = 'lk_op_fila';
function lerFila(){ try { return JSON.parse(localStorage.getItem(FILA)||'{}'); } catch(e){ return {}; } }
function salvarFila(f){ try { localStorage.setItem(FILA, JSON.stringify(f)); } catch(e){} }
function gravar(caminho, obj){
  var key = db.ref(caminho).push().key;
  var f = lerFila(); f[caminho+'/'+key] = obj; salvarFila(f);
  enviar(caminho+'/'+key, obj);
  return key;
}
function enviar(path, obj){
  db.ref(path).set(obj).then(function(){
    var f=lerFila(); delete f[path]; salvarFila(f);
  }).catch(function(e){
    // Se já existe no banco (reenvio), a regra recusa: está tudo certo.
    db.ref(path).once('value').then(function(s){
      if(s.exists()){ var f=lerFila(); delete f[path]; salvarFila(f); }
      else toast('Não foi possível gravar: '+(e && e.code==='PERMISSION_DENIED' ? 'sem permissão' : (e&&e.message||e)), 5000);
    });
  });
}
function reenviarFila(){ var f=lerFila(); Object.keys(f).forEach(function(p){ enviar(p, f[p]); }); }

// ---------- correções ----------
function corrsDe(movId){ return Object.keys(CORR).map(function(k){ var c=CORR[k]; c._key=k; return c; }).filter(function(c){ return c.movId===movId; }).sort(function(a,b){ return (a.ts||0)-(b.ts||0); }); }
function efetivo(m){
  var ap = corrsDe(m._key).filter(function(c){ return c.decisao && c.decisao.status==='aprovada'; });
  if(!ap.length) return m;
  ap.sort(function(a,b){ return a.decisao.ts-b.decisao.ts; });
  var r = Object.assign({}, m, ap[ap.length-1].novo); r._corrigido = true; return r;
}
function statusCorr(m){
  var cs = corrsDe(m._key);
  if(cs.some(function(c){return !c.decisao;})) return '<span class="badge b-y">correção pendente</span>';
  if(cs.some(function(c){return c.decisao && c.decisao.status==='aprovada';})) return '<span class="badge b-g">corrigido</span>';
  return '';
}

// ---------- cálculo da rota ----------
function movsRota(ent,data){ return MOV.filter(function(m){ return m.ent===ent && m.data===data; }).map(efetivo); }
function calcRota(ent,data){
  var ms = movsRota(ent,data);
  var r = {carga:{}, entregue:{}, bonif:{}, trocas:{}, vendas:[], cargas:[], retorno:null, justs:[], formas:{}, total:0, ciente:null, pixOk:null};
  ms.forEach(function(m){
    if(m.tipo==='carga'){ r.carga=soma(r.carga,m.itens); r.cargas.push(m); }
    if(m.tipo==='venda'){ r.entregue=soma(r.entregue,m.prods); r.bonif=soma(r.bonif,m.bonif); r.trocas=soma(r.trocas,m.trocas); r.vendas.push(m); r.formas[m.forma]=(r.formas[m.forma]||0)+(m.valor||0); r.total+=(m.valor||0); }
    if(m.tipo==='retorno' && !r.retorno) r.retorno=m;
    if(m.tipo==='just') r.justs.push(m);
    if(m.tipo==='ciente' && !r.ciente) r.ciente=m;
    if(m.tipo==='pixok' && !r.pixOk) r.pixOk=m;
  });
  r.vendas.sort(function(a,b){ return (a.tsLocal||0)-(b.tsLocal||0); });
  r.dinEsperado = Math.round((r.formas.vista||0)*100)/100;
  r.dinContado = r.retorno ? (r.retorno.dinheiro||0) : null;
  r.difDin = r.retorno ? Math.round((r.dinContado - r.dinEsperado)*100)/100 : 0;
  r.saldo = {}; r.dif = {}; r.difTroca = {}; r.temDif=false; r.temDifTroca=false;
  PRODS.forEach(function(p){ var k=p[0]; r.saldo[k]=(r.carga[k]||0)-(r.entregue[k]||0)-(r.bonif[k]||0); });
  if(r.retorno){
    PRODS.forEach(function(p){ var k=p[0]; r.dif[k]=((r.retorno.util||{})[k]||0)+((r.retorno.perda||{})[k]||0)-r.saldo[k]; if(r.dif[k]) r.temDif=true; });
    PRODS_TROCA.forEach(function(p){ var k=p[0]; r.difTroca[k]=((r.retorno.venc||{})[k]||0)-((r.trocas||{})[k]||0); if(r.difTroca[k]) r.temDifTroca=true; });
  }
  r.fechada = !!r.retorno;
  r.temDifDin = r.fechada && Math.abs(r.difDin) >= 0.01;
  r.temQualquerDif = r.temDif || r.temDifTroca || r.temDifDin;
  return r;
}
// Rota anterior que ainda trava a carga nova: sem retorno/conferência ou
// sem a confirmação ("ciente") do entregador.
function rotaPendente(ent){
  var datas={};
  MOV.forEach(function(m){ if(m.tipo==='carga' && m.ent===ent && m.data<hoje()) datas[m.data]=1; });
  var ds=Object.keys(datas).sort();
  for(var i=0;i<ds.length;i++){ var r=calcRota(ent,ds[i]); if(!r.fechada || !r.ciente) return {data:ds[i], motivo: !r.fechada ? 'a conferência (retorno e dinheiro) ainda não foi lançada' : nomeEnt(ent)+' ainda não confirmou o resultado com o PIN dele'}; }
  return null;
}
function dataLocal(ts){ var d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// Avisos de horário de uma venda (para a gerência enxergar lançamentos tardios)
function avisosVenda(m){
  var a='';
  if(m.tsLocal && dataLocal(m.tsLocal)!==m.data) a+='<span class="badge b-r">lançada fora do dia da rota</span>';
  if(typeof m.ts==='number' && m.tsLocal && (m.ts-m.tsLocal)>2*3600000) a+='<span class="badge b-y">enviada '+Math.round((m.ts-m.tsLocal)/3600000)+'h depois (sem internet)</span>';
  return a;
}
function rotasAbertas(ent){
  var datas = {};
  MOV.forEach(function(m){ if(m.tipo==='carga' && (!ent || m.ent===ent)) datas[m.ent+'|'+m.data]=1; });
  return Object.keys(datas).map(function(k){ var p=k.split('|'); return {ent:p[0], data:p[1]}; })
    .filter(function(x){ return !calcRota(x.ent,x.data).fechada; })
    .sort(function(a,b){ return a.data<b.data?-1:1; });
}

// ---------- telas: componentes ----------
function gradeQtd(pref, lista, val){
  return '<div class="grade">'+lista.map(function(p){
    var v = val && val[p[0]] ? val[p[0]] : '';
    return '<div class="nm">'+esc(p[1])+'</div><input class="inp" type="number" min="0" inputmode="numeric" id="'+pref+p[0]+'" value="'+v+'" placeholder="0">';
  }).join('')+'</div>';
}
function lerQtd(pref, lista){
  var o={}; lista.forEach(function(p){ var el=$(pref+p[0]); var q=el?parseInt(el.value,10):0; if(q>0) o[p[0]]=q; }); return o;
}
function abrirModal(html){ $('modal-box').innerHTML=html; $('modal').className='modal on'; }
var renderAposModal=false;
function fecharModal(){ $('modal').className='modal'; if(renderAposModal){ renderAposModal=false; setTimeout(render,0); } }
function confirmar(titulo, corpo, onOk, textoOk){
  abrirModal('<h3>'+esc(titulo)+'</h3>'+corpo+
    '<div class="alert a-y" style="margin-top:12px">Depois de gravado, não dá para editar nem apagar. Erros só com correção aprovada pela gerência.</div>'+
    '<div class="row"><button class="btn btn-o" id="m-cancel">Voltar</button><button class="btn btn-g" id="m-ok">'+esc(textoOk||'Gravar')+'</button></div>');
  $('m-cancel').onclick=fecharModal;
  $('m-ok').onclick=function(){ this.disabled=true; fecharModal(); onOk(); };
}
function base(tipo, ent, data){ return {tipo:tipo, ent:ent, data:data, ts:TS, por:U.email, porNome:U.nome}; }
function seletorRota(lista, idSel){
  if(!lista.length) return '';
  if(lista.length===1){ rotaSel = idRota(lista[0].ent,lista[0].data); }
  if(!lista.some(function(x){return idRota(x.ent,x.data)===rotaSel;})) rotaSel = idRota(lista[0].ent,lista[0].data);
  return '<div class="field"><label>Rota</label><select class="inp" id="'+idSel+'">'+lista.map(function(x){
    var id=idRota(x.ent,x.data);
    return '<option value="'+id+'"'+(id===rotaSel?' selected':'')+'>'+esc(nomeEnt(x.ent))+' — carga de '+fdata(x.data)+'</option>';
  }).join('')+'</select></div>';
}
function rotaDoId(id){ var i=id.lastIndexOf('_'); return {ent:id.slice(0,i), data:id.slice(i+1)}; }

// ---------- FÁBRICA: carga ----------
function telaCarga(){
  var h='<div class="stitle">Saída de mercadoria — '+fdata(hoje())+'</div>';
  ENTREGADORES.forEach(function(e){ var p=rotaPendente(e.id);

// Número da nota: gerado pelo sistema, sequencial dentro da rota (ex.: 0311-07).
// Não existe bloco de papel: não há como emitir nota "por fora".
function proximoNumero(ent, data){
  var n = MOV.filter(function(m){ return m.tipo==='venda' && m.ent===ent && m.data===data; }).length + 1;
  return data.slice(8,10)+data.slice(5,7)+'-'+String(n).padStart(2,'0');
}
function textoComprovante(o){
  var l=['*Lelé da Kuka* — comprovante de entrega','Nota '+o.numero+' · '+fdata(o.data),'Cliente: '+o.cliNome,''];
  Object.keys(o.prods||{}).forEach(function(k){ l.push(o.prods[k]+' × '+nomeProd(k)); });
  if(totalUn(o.trocas)) l.push('Trocas: '+resumoItens(o.trocas));
  if(totalUn(o.bonif)) l.push('Bonificação: '+resumoItens(o.bonif));
  l.push('','Total: '+fmt(o.valor)+' · '+nomeForma(o.forma),'Entregue por '+o.porNome+'.');
  return l.join('\n');
}
// Área de assinatura com o dedo (gera imagem pequena para guardar no banco)
function padAssinatura(cv){
  var ctx, tracos=0, desenhando=false;
  function ajusta(){ var r=cv.getBoundingClientRect(); cv.width=Math.max(300,Math.round(r.width||600)); cv.height=Math.round(r.height||170); ctx=cv.getContext('2d'); if(!ctx) return; ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1a1a1a'; }
  ajusta();
  function pos(e){ var r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*(cv.width/(r.width||cv.width)), y:(e.clientY-r.top)*(cv.height/(r.height||cv.height))}; }
  cv.addEventListener('pointerdown', function(e){ if(!ctx) return; desenhando=true; tracos++; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); try{cv.setPointerCapture(e.pointerId);}catch(x){} e.preventDefault(); });
  cv.addEventListener('pointermove', function(e){ if(!desenhando||!ctx) return; var p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ cv.addEventListener(ev, function(){ desenhando=false; }); });
  return {
    vazia:function(){ return tracos===0; },
    limpar:function(){ tracos=0; if(ctx) ctx.clearRect(0,0,cv.width,cv.height); },
    imagem:function(){
      // reduz para no máximo 400px de largura, fundo branco, JPEG leve
      try{ var w=Math.min(400,cv.width), h=Math.round(cv.height*w/cv.width), c=document.createElement('canvas'); c.width=w; c.height=h; var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(cv,0,0,w,h); return c.toDataURL('image/jpeg',0.6); }catch(e){ return ''; }
    },
    _marcar:function(){ tracos++; } // usado só em testes
  };
}

function cardsCiente(ent){
  var h='';

    var r=calcRota(m.ent,m.data); if(r.retorno!==m || r.ciente) return;
    if(U.papel!=='entregador') return;
    h+='<div class="stitle">Resultado da rota de '+fdata(m.data)+'</div><div class="card">'+
      (r.temQualquerDif?'<div class="alert a-r">A conferência encontrou diferença.</div>':'<div class="alert a-g">Tudo bateu ✓</div>')+tabelaConf(r)+
      '<div class="field" style="margin-top:12px"><label>Comentário (opcional)</label><textarea class="inp" rows="2" id="ci-'+m.data+'" placeholder="Se discorda de algo, explique aqui"></textarea></div>'+
      '<button class="btn btn-g ci-btn" data-ent="'+esc(m.ent)+'" data-data="'+m.data+'">Vi o resultado — confirmar</button>'+
      '<p class="muted" style="margin-top:8px">Sem essa confirmação, a carga de hoje não é liberada.</p></div>';
  });
  return h;

    var d=b.getAttribute('data-data'), o=base('ciente',b.getAttribute('data-ent'),d); o.comentario=($('ci-'+d)||{}).value||'';
    gravar(OP+'/mov',o); toast('Confirmado ✓');
  }; });
}
function precosDigitados(){ var o={}; ['suco','salada'].forEach(function(k){ var v=parseFloat(($('v-p-'+k)||{}).value); if(v>0) o[k]=v; }); return o; }
function valorVenda(cli, prods, trocas, pd){
  var v=0; Object.keys(prods||{}).forEach(function(k){ v+=prods[k]*((k==='suco'||k==='salada')?((pd||{})[k]||0):precoCli(cli,k)); });
  Object.keys(trocas||{}).forEach(function(k){ v-=trocas[k]*precoCli(cli,k); });
  return v;
}
function ligarBusca(){
  var inp=$('v-busca'), drop=$('v-drop');
  var mostra=function(){
    var t=inp.value.trim().toLowerCase();
    var l=CLI.filter(function(c){ return !t || nomeCli(c).toLowerCase().indexOf(t)>=0 || (c.nome||'').toLowerCase().indexOf(t)>=0; }).slice(0,40);
    drop.innerHTML=l.map(function(c){return '<div data-k="'+esc(c._key)+'">'+esc(nomeCli(c))+'</div>';}).join('')||'<div class="muted">Nenhum cliente</div>';
    drop.style.display='block';
    drop.querySelectorAll('[data-k]').forEach(function(d){ d.onclick=function(){ vendaCli=CLI.find(function(c){return c._key===d.getAttribute('data-k');}); render(); }; });
  };
  inp.oninput=mostra; inp.onfocus=mostra;
}
function ultimasFechadas(ent){
  var fech = MOV.filter(function(m){ return m.tipo==='retorno' && (!ent||m.ent===ent); }).sort(function(a,b){return a.data<b.data?1:-1;}).slice(0,3);
  if(!fech.length) return '';
  return '<div class="stitle">Rotas fechadas recentes</div>'+fech.map(function(m){ var r=calcRota(m.ent,m.data);
    return '<div class="card"><b>'+esc(nomeEnt(m.ent))+' — '+fdata(m.data)+'</b><div class="muted">'+r.vendas.length+' entregas · '+fmt(r.total)+'</div>'+r.vendas.map(linhaMov).join('')+'</div>'; }).join('');
}

// ---------- linha de lançamento + pedido de correção ----------
function linhaMov(m){
  var t='', s='';
  if(m.tipo==='carga'){ t='Saída · '+nomeEnt(m.ent); s=resumoItens(m.itens); }
  if(m.tipo==='venda'){ t=(m.numero?'Nota '+m.numero+' · ':'')+m.cliNome+' · '+fmt(m.valor)+' · '+nomeForma(m.forma); s='Entregue: '+resumoItens(m.prods)+(totalUn(m.trocas)?' | Trocas: '+resumoItens(m.trocas):'')+(totalUn(m.bonif)?' | Bonif.: '+resumoItens(m.bonif):''); }
  if(m.tipo==='retorno'){ t='Conferência · '+nomeEnt(m.ent); s='Retorno: '+resumoItens(m.util)+' | Perda: '+resumoItens(limpa(m.perda))+(m.perdaMotivo?' ('+m.perdaMotivo+')':'')+' | Trocas clientes: '+resumoItens(m.venc)+' | Dinheiro contado: '+fmt(m.dinheiro); }
  if(m.tipo==='just'){ t='Justificativa · '+nomeEnt(m.ent); s=m.texto; }
  if(m.tipo==='ciente'){ t=nomeEnt(m.ent)+' confirmou o resultado'; s=m.comentario?('Comentário: '+m.comentario):''; }
  if(m.tipo==='pixok'){ t='Pix conferido com o extrato'; s=fmt(m.valor)+(m.obs?' · '+m.obs:''); }
  var hora = m.tipo==='venda' && m.tsLocal ? fhora(m.tsLocal) : fhora(m.ts);
  var podePedir = ['carga','venda','retorno'].indexOf(m.tipo)>=0 && (U.papel==='gerencia' || m.por===U.email) && !corrsDe(m._key).some(function(c){return !c.decisao;});
  return '<div class="mov"><div class="t">'+esc(t)+statusCorr(m)+(m.tipo==='venda'?avisosVenda(m):'')+'</div>'+(s?'<div class="s">'+esc(s)+'</div>':'')+'<div class="s">'+esc(m.porNome||m.por)+' · '+hora+'</div>'+
    (m.tipo==='venda' && m.assinatura && U.papel==='gerencia' ? '<details style="margin-top:4px"><summary class="s" style="cursor:pointer">ver assinatura</summary><img src="'+esc(m.assinatura)+'" alt="Assinatura" style="max-width:100%;border:1px solid var(--b);border-radius:8px;margin-top:4px"></details>' : '')+
    (podePedir?'<button class="btn btn-o btn-sm pc-btn" data-k="'+esc(m._key)+'" style="margin-top:6px">Pedir correção</button>':'')+'</div>';
}
function ligarCorrecoes(){
  document.querySelectorAll('.pc-btn').forEach(function(b){ b.onclick=function(){ abrirCorrecao(b.getAttribute('data-k')); }; });
}
function abrirCorrecao(key){
  var orig=MOV.find(function(m){return m._key===key;}); if(!orig) return;
  var m=efetivo(orig), h='<h3>Pedir correção</h3><p class="muted" style="margin-bottom:12px">O lançamento original fica guardado. A gerência aprova ou rejeita.</p>';
  if(m.tipo==='carga') h+='<div class="stitle">Quantidades corretas</div>'+gradeQtd('k-i-',PRODS,m.itens);
  if(m.tipo==='retorno') h+='<div class="stitle">Sanduíches de retorno</div>'+gradeQtd('k-u-',PRODS,limpa(m.util))+'<div class="stitle">Perda</div>'+gradeQtd('k-p-',PRODS,limpa(m.perda))+'<div class="field" style="margin-top:10px"><label>Justificativa da perda</label><textarea class="inp" rows="2" id="k-pm">'+esc(m.perdaMotivo||'')+'</textarea></div>'+'<div class="stitle">Trocas clientes</div>'+gradeQtd('k-v-',PRODS_TROCA,limpa(m.venc))+
    '<div class="field" style="margin-top:12px"><label>Dinheiro contado correto (R$)</label><input class="inp" type="number" step="0.01" id="k-din" value="'+(m.dinheiro||0)+'"></div>';
  if(m.tipo==='venda') h+='<p><b>'+esc(m.cliNome)+'</b></p><div class="stitle">Entregue</div>'+gradeQtd('k-q-',PRODS,m.prods)+'<div class="stitle">Trocas</div>'+gradeQtd('k-t-',PRODS_TROCA,m.trocas)+'<div class="stitle">Bonificação</div>'+gradeQtd('k-b-',PRODS,m.bonif)+
    '<div class="stitle">Pagamento</div><select class="inp" id="k-forma">'+FORMAS.map(function(f){return '<option value="'+f[0]+'"'+(f[0]===m.forma?' selected':'')+'>'+esc(f[1])+'</option>';}).join('')+'</select>';
  h+='<div class="field" style="margin-top:12px"><label>Motivo</label><textarea class="inp" rows="3" id="k-motivo" placeholder="Ex.: erro na contagem durante a separação"></textarea></div>';
  h+='<div class="row"><button class="btn btn-o" onclick="fecharModal()">Cancelar</button><button class="btn btn-g" id="k-ok">Enviar pedido</button></div>';
  abrirModal(h);
  $('k-ok').onclick=function(){
    var mot=$('k-motivo').value.trim(); if(mot.length<5) return toast('Escreva o motivo');
    var novo={};
    if(m.tipo==='carga') novo.itens=lerQtd('k-i-',PRODS);
    if(m.tipo==='retorno'){ novo.util=lerQtd('k-u-',PRODS); novo.perda=lerQtd('k-p-',PRODS); novo.perdaMotivo=$('k-pm').value.trim(); if(totalUn(novo.perda) && novo.perdaMotivo.length<5) return toast('Escreva a justificativa da perda'); novo.venc=lerQtd('k-v-',PRODS_TROCA); novo.dinheiro=Math.round((parseFloat($('k-din').value)||0)*100)/100; }
    if(m.tipo==='venda'){
      novo.prods=lerQtd('k-q-',PRODS); novo.trocas=lerQtd('k-t-',PRODS_TROCA); novo.bonif=lerQtd('k-b-',PRODS); novo.forma=$('k-forma').value;
      var cli=CLI.find(function(c){return c.id==m.cliId;}); novo.valor=Math.round(valorVenda(cli,novo.prods,novo.trocas,m.precos)*100)/100;
    }
    // Firebase não guarda objetos vazios; marca com 0 para "zerar"
    Object.keys(novo).forEach(function(k){ if(typeof novo[k]==='object' && !Object.keys(novo[k]).length) novo[k]={_:0}; });
    gravar(OP+'/corr',{movId:key, tipo:m.tipo, novo:novo, motivo:mot, ts:TS, por:U.email, porNome:U.nome});
    fecharModal(); toast('Pedido enviado para a gerência ✓');
  };
}

// ---------- GERÊNCIA ----------
function telaGerencia(){
  var h=MODO_TESTE?'<div class="alert a-y"><b>Fase de teste.</b> Nada daqui vai para as Entregas, Cobranças ou Caixa do Sistema Lelé.</div>':'';
  h+='<div class="stitle">Fechamento</div><div class="card"><div class="field"><label>Data da carga</label><input class="inp" type="date" id="g-dia" value="'+gerDia+'"></div><div class="muted">Lista de clientes da operação: '+CLI.length+' (atualizada a partir do cadastro do sistema).</div></div>';
  var pend=Object.keys(CORR).map(function(k){var c=CORR[k]; c._key=k; return c;}).filter(function(c){return !c.decisao;});
  if(pend.length){
    h+='<div class="stitle">Correções aguardando você ('+pend.length+')</div>';
    pend.forEach(function(c){
      var orig=MOV.find(function(m){return m._key===c.movId;});
      var atual=orig?efetivo(orig):null;
      h+='<div class="card"><div class="alert a-y"><b>'+esc(c.porNome||c.por)+'</b> · '+fhora(c.ts)+'<br>Motivo: '+esc(c.motivo)+'</div>';
      if(atual) h+='<p class="muted">'+esc((atual.cliNome||nomeEnt(atual.ent))+' · '+fdata(atual.data))+'</p>'+compararCorr(atual,c.novo);
      else h+='<p class="muted">Lançamento de outro período (abra a data dele para ver os detalhes).</p>';
      h+='<div class="row" style="margin-top:12px"><button class="btn btn-r cd-btn" data-k="'+esc(c._key)+'" data-s="rejeitada">Rejeitar</button><button class="btn btn-g cd-btn" data-k="'+esc(c._key)+'" data-s="aprovada">Aprovar</button></div></div>';
    });
  }
  ENTREGADORES.forEach(function(e){
    var r=calcRota(e.id,gerDia);
    h+='<div class="stitle">'+esc(e.nome)+' — carga de '+fdata(gerDia)+'</div><div class="card">';
    if(!r.cargas.length){ h+='<div class="muted">Sem saída lançada nesta data.</div></div>'; return; }
    if(!r.fechada) h+='<div class="alert a-y">Rota aberta: a conferência ainda não foi lançada.</div>';
    else if(r.temQualquerDif) h+='<div class="alert a-r">Diferença na conferência.'+(r.justs.length?'':' Sem justificativa ainda.')+'</div>';
    else h+='<div class="alert a-g">Tudo bateu ✓</div>';
    if(r.fechada) h+=r.ciente?'<div class="alert a-g">'+esc(nomeEnt(e.id))+' confirmou o resultado em '+fhora(r.ciente.ts)+(r.ciente.comentario?' — "'+esc(r.ciente.comentario)+'"':'')+'</div>':'<div class="alert a-y">Aguardando '+esc(nomeEnt(e.id))+' confirmar o resultado.</div>';
    var tardias=r.vendas.filter(function(v){ return v.tsLocal && dataLocal(v.tsLocal)!==v.data; }).length;
    if(tardias) h+='<div class="alert a-r">'+tardias+' entrega(s) lançada(s) fora do dia da rota. Confira se são reais.</div>';
    h+=tabelaConf(r);
    r.justs.forEach(function(j){ h+='<div class="alert a-y" style="margin-top:10px"><b>Justificativa</b> ('+esc(j.porNome)+', '+fhora(j.ts)+'): '+esc(j.texto)+'</div>'; });
    h+='<div class="stitle">Vendas por forma de pagamento</div><table>'+FORMAS.map(function(f){ return r.formas[f[0]]?'<tr><td>'+esc(f[1])+'</td><td>'+fmt(r.formas[f[0]])+'</td></tr>':''; }).join('')+'<tr><td><b>Total</b></td><td><b>'+fmt(r.total)+'</b></td></tr></table>';
    if(r.formas.pix){
      if(r.pixOk) h+='<div class="alert a-g" style="margin-top:10px">Pix conferido com o extrato: '+fmt(r.pixOk.valor)+(Math.abs(r.pixOk.valor-r.formas.pix)>=0.01?' <b>(lançado na rota: '+fmt(r.formas.pix)+')</b>':'')+' · '+fhora(r.pixOk.ts)+'</div>';
      else h+='<div class="card" style="margin-top:10px;background:#faf8f4"><div class="field"><label>Pix que entrou no extrato (R$) — esperado '+fmt(r.formas.pix)+'</label><input class="inp" type="number" step="0.01" id="px-'+e.id+'"></div><button class="btn btn-o px-btn" data-ent="'+e.id+'">Marcar Pix conferido</button></div>';
    }
    var naoImp=r.vendas.filter(function(v){return !IMP[v._key];});
    h+='<div class="stitle">Entregas ('+r.vendas.length+')</div>'+(r.vendas.map(function(v){ return linhaMov(v).replace('<div class="t">','<div class="t">'+(IMP[v._key]?'<span class="badge b-g" style="margin:0 6px 0 0">no sistema</span>':'')); }).join('')||'<div class="muted">Nenhuma lançada.</div>');
    if(!MODO_TESTE && naoImp.length && r.fechada) h+='<button class="btn btn-o imp-btn" style="margin-top:12px" data-ent="'+e.id+'">Lançar '+naoImp.length+' entrega(s) no Sistema Lelé</button>';
    h+='<div class="stitle">Movimentos</div>'+r.cargas.concat(r.retorno?[r.retorno]:[]).concat(r.ciente?[r.ciente]:[]).map(linhaMov).join('');
    h+='</div>';
  });
  $('conteudo').innerHTML=h;
  $('g-dia').onchange=function(){ gerDia=this.value||hoje(); assinarMov(); render(); };
  document.querySelectorAll('.cd-btn').forEach(function(b){ b.onclick=function(){
    var s=b.getAttribute('data-s'), k=b.getAttribute('data-k');
    if(!confirm(s==='aprovada'?'Aprovar esta correção? Os números passam a valer o novo valor (o original fica no histórico).':'Rejeitar esta correção?')) return;
    db.ref(OP+'/corr/'+k+'/decisao').set({status:s, ts:TS, por:U.email}).then(function(){ toast(s==='aprovada'?'Aprovada ✓':'Rejeitada'); }).catch(function(e){ toast('Erro: '+(e.message||e),5000); });
  }; });
  document.querySelectorAll('.imp-btn').forEach(function(b){ b.onclick=function(){ importarEntregas(b.getAttribute('data-ent'), gerDia, b); }; });
  document.querySelectorAll('.px-btn').forEach(function(b){ b.onclick=function(){
    var ent=b.getAttribute('data-ent'), v=parseFloat(($('px-'+ent)||{}).value);
    if(isNaN(v)) return toast('Informe o valor que entrou no extrato');
    var o=base('pixok',ent,gerDia); o.valor=Math.round(v*100)/100; gravar(OP+'/mov',o); toast('Pix conferido ✓');
  }; });
  ligarCorrecoes();
}
function compararCorr(m,novo){
  var campos = m.tipo==='carga'?[['itens','Saída']]:m.tipo==='retorno'?[['util','Retorno'],['perda','Perda'],['venc','Trocas clientes']]:[['prods','Entregue'],['trocas','Trocas'],['bonif','Bonificação']];
  var h='<table><tr><th></th><th>Antes</th><th>Depois</th></tr>';
  campos.forEach(function(c){ h+='<tr><td>'+c[1]+'</td><td>'+esc(resumoItens(limpa(m[c[0]])))+'</td><td><b>'+esc(resumoItens(limpa(novo[c[0]])))+'</b></td></tr>'; });
  if(m.tipo==='venda') h+='<tr><td>Pagamento</td><td>'+fmt(m.valor)+' · '+esc(nomeForma(m.forma))+'</td><td><b>'+fmt(novo.valor)+' · '+esc(nomeForma(novo.forma))+'</b></td></tr>';
  if(m.tipo==='retorno' && (m.perdaMotivo||novo.perdaMotivo)!==undefined && (m.perdaMotivo||'')!==(novo.perdaMotivo||'')) h+='<tr><td>Justificativa da perda</td><td>'+esc(m.perdaMotivo||'—')+'</td><td><b>'+esc(novo.perdaMotivo||'—')+'</b></td></tr>';
  if(m.tipo==='retorno') h+='<tr><td>Dinheiro contado</td><td>'+fmt(m.dinheiro)+'</td><td><b>'+fmt(novo.dinheiro)+'</b></td></tr>';
  return h+'</table>';
}
function limpa(o){ var r={}; Object.keys(o||{}).forEach(function(k){ if(k!=='_' && o[k]) r[k]=o[k]; }); return r; }

// Cria as entregas no sistema principal (coleção "entregas"), no mesmo
// formato da tela Entrega, e marca em op/importadas para não duplicar.
function importarEntregas(ent, data, btn){
  if(MODO_TESTE) return toast('Fase de teste: nada é lançado no Sistema Lelé.');
  var r=calcRota(ent,data), lista=r.vendas.filter(function(v){return !IMP[v._key];});
  if(!lista.length) return;
  if(!confirm('Lançar '+lista.length+' entrega(s) de '+nomeEnt(ent)+' ('+fdata(data)+') na aba Entregas do Sistema Lelé?')) return;
  btn.disabled=true;
  var up={};
  lista.forEach(function(v,i){
    var cli=CLI.find(function(c){return c.id==v.cliId;}), prods=limpa(v.prods), trocas=limpa(v.trocas), bonif=limpa(v.bonif);
    var vt=0; Object.keys(trocas).forEach(function(k){ vt+=trocas[k]*precoCli(cli,k); });
    var pago = (v.forma==='vista'||v.forma==='pix');
    var e={id:Date.now()+i, clienteId:v.cliId, data:data, boleto:'', produtos:prods, trocas:trocas, bonificacao:bonif, precosUsados:v.precos||{},
      pagamento:(v.forma==='vista'?'vista':v.forma), valorTotal:v.valor, valorTroca:Math.round(vt*100)/100, pago:pago, origem:'rota', opMov:v._key};
    if(pago){ e.pgData=data; e.pgObs=(v.forma==='vista'?'Dinheiro':'PIX')+' — lançado na rota'; }
    up['entregas/'+db.ref('entregas').push().key]=e;
    up[OP+'/importadas/'+v._key]={ts:TS, por:U.email};
  });
  db.ref().update(up).then(function(){ toast('Entregas lançadas no sistema ✓'); }).catch(function(e){ btn.disabled=false; toast('Erro: '+(e.message||e),5000); });
}

// ---------- navegação ----------
var ABAS = {
  fabrica:[['retorno','Conferência'],['carga','Saída']],
  entregador:[['rota','Minhas entregas']],
  gerencia:[['gerencia','Fechamento'],['retorno','Conferência'],['carga','Saída'],['rota','Rota']]
};
function montarNav(){
  var abas=ABAS[U.papel]; if(!aba) aba=abas[0][0];
  $('nav').innerHTML=abas.length>1?abas.map(function(a){return '<div class="tab'+(a[0]===aba?' on':'')+'" data-a="'+a[0]+'">'+esc(a[1])+'</div>';}).join(''):'';
  $('nav').style.display=abas.length>1?'flex':'none';
  document.querySelectorAll('.tab').forEach(function(t){ t.onclick=function(){ aba=t.getAttribute('data-a'); vendaCli=null; montarNav(); render(); window.scrollTo(0,0); }; });
}
function render(){
  if(aba==='carga') telaCarga(); else if(aba==='retorno') telaRetorno(); else if(aba==='rota') telaRota(); else telaGerencia();
}
var renderPend=false;
function renderAoMudar(){
  // Dados chegaram do banco. Se a pessoa estiver no meio de um formulário,
  // espera ela sair do campo para atualizar a tela.
  var el=document.activeElement;
  if(el && (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT') && $('conteudo').contains(el)){
    if(!renderPend){ renderPend=true; el.addEventListener('blur', function f(){ el.removeEventListener('blur',f); renderPend=false; setTimeout(render,50); }); }
    return;
  }
  if($('modal').className.indexOf('on')>=0){ renderAposModal=true; return; }
  render();
}

// ---------- dados ----------
var ultimaSync='';
function sincronizarClientes(todos){
  var lista={};
  Object.keys(todos).forEach(function(k){ var c=todos[k]; if(!c || c.id==null) return;
    var o={id:c.id, nome:c.nome||''}; if(c.fantasia) o.fantasia=c.fantasia;
    if(c.precos){ var p={}; Object.keys(c.precos).forEach(function(pk){ var v=parseFloat(c.precos[pk]); if(v>0) p[pk]=v; }); if(Object.keys(p).length) o.precos=p; }
    lista[k]=o; });
  var j=JSON.stringify(lista); if(j===ultimaSync) return; ultimaSync=j;
  db.ref('op_clientes').set(lista).catch(function(e){ toast('Não consegui atualizar a lista de clientes: '+(e.message||e),5000); });
}
function assinarMov(){
  if(subMov) subMov.off();
  var ini = somaDias(hoje(), -DIAS_ROTA); if(gerDia<ini) ini=gerDia;
  subMov = db.ref(OP+'/mov').orderByChild('data').startAt(ini);
  subMov.on('value', function(s){
    var v=s.val()||{}; MOV=Object.keys(v).map(function(k){ var o=v[k]; o._key=k; return o; });
    renderAoMudar();
  }, function(e){ toast('Sem acesso aos lançamentos: '+e.message, 6000); });
}
function iniciar(){
  montarNav();
  // Clientes: a Darling e o Will leem só "op_clientes" (nome + tabela de preço).
  // Quando a gerência abre esta página, essa lista é atualizada a partir do
  // cadastro completo ("clientes"), que só a gerência pode ler.
  db.ref('op_clientes').on('value', function(s){ var v=s.val()||{}; CLI=Object.keys(v).map(function(k){var o=v[k]; o._key=k; return o;}).sort(function(a,b){return nomeCli(a).localeCompare(nomeCli(b),'pt-BR');}); renderAoMudar(); }, function(e){ toast('Sem acesso aos clientes: '+e.message,6000); });
  if(U.papel==='gerencia') db.ref('clientes').on('value', function(s){ sincronizarClientes(s.val()||{}); });
  db.ref(OP+'/corr').on('value', function(s){ CORR=s.val()||{}; renderAoMudar(); });
  if(U.papel==='gerencia') db.ref(OP+'/importadas').on('value', function(s){ IMP=s.val()||{}; renderAoMudar(); });
  assinarMov();
  db.ref('.info/connected').on('value', function(s){ var on=!!s.val(); $('conexao').textContent=on?'online':'sem internet — salvando no aparelho'; $('conexao').className=on?'':'off'; if(on) reenviarFila(); });
  render();
}

$('login-pessoas').innerHTML = USUARIOS_OP.map(function(u,i){ return '<div class="pessoa" data-i="'+i+'">'+esc(u.nome)+'</div>'; }).join('');
document.querySelectorAll('.pessoa').forEach(function(p){ p.onclick=function(){
  document.querySelectorAll('.pessoa').forEach(function(x){x.classList.remove('on');}); p.classList.add('on'); pessoaSel=USUARIOS_OP[+p.getAttribute('data-i')]; $('pin').focus();
}; });
function entrarPin(){
  $('login-erro').textContent='';
  if(!pessoaSel) return $('login-erro').textContent='Escolha quem está lançando.';
  var pin=$('pin').value.trim(); if(!/^\d{4}$/.test(pin)) return $('login-erro').textContent='O PIN tem 4 números.';
  $('btn-entrar-pin').disabled=true;
  auth.signInWithEmailAndPassword(pessoaSel.email, 'lk-'+pin+'-op').catch(function(e){
    $('btn-entrar-pin').disabled=false;
    $('login-erro').textContent = (e.code==='auth/too-many-requests') ? 'Muitas tentativas. Espere alguns minutos.' : 'PIN incorreto.';
  });
}
$('btn-entrar-pin').onclick=entrarPin;
$('pin').onkeydown=function(e){ if(e.key==='Enter') entrarPin(); };
$('btn-entrar-google').onclick=function(){
  var p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(p).catch(function(e){ if(e && e.code==='auth/popup-blocked') return auth.signInWithRedirect(p); if(e && e.code!=='auth/popup-closed-by-user') $('login-erro').textContent='Não foi possível entrar: '+(e.message||e); });
};
$('btn-sair').onclick=function(){ auth.signOut().then(function(){ location.reload(); }); };
$('modal').onclick=function(e){ if(e.target===this) fecharModal(); };

var iniciado=false;
auth.onAuthStateChanged(function(user){
  if(!user){ $('login').style.display='flex'; return; }
  var email=(user.email||'').toLowerCase();
  var op = USUARIOS_OP.find(function(u){ return u.email===email; });
  if(EMAILS_GERENCIA.indexOf(email)>=0){ U={email:email, nome:user.displayName||email, papel:'gerencia', ent:''}; }
  else if(op && email.indexOf('fabrica')===0){ U={email:email, nome:op.nome, papel:'fabrica', ent:''}; }
  else if(op && ENTREGADORES.some(function(e){ return e.id+DOMINIO_OP===email; })){ U={email:email, nome:op.nome, papel:'entregador', ent:email.split('@')[0]}; }
  else { auth.signOut(); $('login').style.display='flex'; $('login-erro').textContent='A conta '+email+' não tem acesso.'; return; }
  $('login').style.display='none';
  $('quem').textContent=U.nome;
  if(!iniciado){ iniciado=true; iniciar(); }
});
</script>
</body>
</html>
